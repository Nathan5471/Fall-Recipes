services:
  fall-recipes:
    image: nathan5471/fall-recipes:latest
    container_name: fall-recipes
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=your_jwt_secret
      - MONGODB_URL=your_mongodb_connection_string
    restart: unless-stopped
    volumes:
      - uploads:/backend/uploads
    
volumes:
  uploads: